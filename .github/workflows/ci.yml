name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: chain-copy guard + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Runs first so a copy violation surfaces before the slower build steps.
      - name: Chain-copy guard
        run: node scripts/check-chain-copy.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run lint
